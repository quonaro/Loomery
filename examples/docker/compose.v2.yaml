name: loomery-opencode-v2
services:
  opencode:
    container_name: loomery-opencode
    build:
      context: .
      dockerfile: Dockerfile.v2
    ports:
      - "127.0.0.1:${LOOMERY_SERVER_PORT:-4096}:4096"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
    working_dir: ${LOOMERY_WORKSPACE:?Set LOOMERY_WORKSPACE to an absolute workspace path}
    volumes:
      - type: bind
        source: ${LOOMERY_WORKSPACE}
        target: ${LOOMERY_WORKSPACE}
      - config:/root/.config/opencode
      - data:/root/.local/share/opencode
volumes:
  config:
  data:
